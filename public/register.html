<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Bot Pengeluaran</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .register-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .register-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .register-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #667eea;
            margin-top: 5px;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e0e0e0;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .phone-hint {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .otp-section {
            display: none;
        }

        .otp-timer {
            text-align: center;
            margin: 15px 0;
            font-size: 14px;
            color: #667eea;
            font-weight: 500;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <h1>📱 Daftar Akun</h1>
                <p>Daftar untuk menggunakan Bot Pengeluaran WhatsApp</p>
            </div>

            <div id="alertBox" class="alert"></div>

            <form id="registerForm">
                <!-- Step 1: Request OTP -->
                <div id="phoneSection">
                    <div class="form-group">
                        <label for="phoneNumber">Nomor WhatsApp</label>
                        <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="08123456789" required
                            pattern="[0-9]+">
                        <div class="phone-hint">Gunakan nomor WhatsApp aktif Anda</div>
                    </div>

                    <button type="button" id="requestOtpBtn" class="btn btn-primary">
                        Kirim Kode OTP
                    </button>
                </div>

                <!-- Step 2: Verify OTP & Complete Registration -->
                <div id="otpSection" class="otp-section">
                    <div class="form-group">
                        <label for="otpCode">Kode OTP</label>
                        <input type="text" id="otpCode" name="otpCode" placeholder="123456" maxlength="6"
                            pattern="[0-9]{6}">
                        <div class="phone-hint">Cek WhatsApp Anda untuk kode OTP</div>
                    </div>

                    <div id="otpTimer" class="otp-timer"></div>

                    <div class="form-group">
                        <label for="name">Nama Lengkap</label>
                        <input type="text" id="name" name="name" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password (Opsional)</label>
                        <input type="password" id="password" name="password" placeholder="Minimal 6 karakter"
                            minlength="6">
                        <div class="phone-hint">Password untuk login ke dashboard web</div>
                    </div>

                    <button type="submit" id="registerBtn" class="btn btn-primary">
                        Daftar Sekarang
                    </button>

                    <button type="button" id="resendOtpBtn" class="btn btn-secondary" disabled>
                        Kirim Ulang OTP
                    </button>
                </div>
            </form>

            <div class="login-link">
                Sudah punya akun? <a href="/">Login di sini</a>
            </div>
        </div>
    </div>

    <script src="/js/register.js"></script>
</body>

</html>
